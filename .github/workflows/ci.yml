name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,allure]"
      - run: python -m pytest -m "not e2e and not packaging"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEHAVE_HIVE_E2E_KEEP: ${{ github.workspace }}/e2e-reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,allure,playwright]"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - run: python -m pytest -m e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e-reports/
            playwright-report/
          retention-days: 7

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m packaging

  e2e-windows:
    name: e2e (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BEHAVE_HIVE_E2E_KEEP: ${{ github.workspace }}/e2e-reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,allure,playwright]"
      - run: python -m playwright install chromium
      - run: python -m pytest -m e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports-windows
          path: |
            e2e-reports/
            playwright-report/
          retention-days: 7

  packaging-windows:
    name: packaging (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m packaging

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pylint src
      - run: pip-audit --local --skip-editable

  measure:
    name: measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,allure]"
      - name: Measure coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -m pytest -m "not e2e and not packaging" --cov --cov-fail-under=0 --cov-report=term-missing | tee .artifacts/coverage-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-data-${{ matrix.os }}
          path: |
            .artifacts/.coverage
            .artifacts/coverage-${{ matrix.os }}.txt
          include-hidden-files: true
          retention-days: 7

  coverage:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,allure]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: .artifacts/data
      - name: Combine coverage
        shell: bash
        run: |
          set -o pipefail
          python -m coverage combine .artifacts/data/*/.coverage
          python -m coverage json
          python -m coverage xml
          python -m coverage report --fail-under=0 | tee .artifacts/coverage.txt
      - name: Check exact coverage counters
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(".artifacts/coverage.json")
          if not report.is_file():
              raise SystemExit(".artifacts/coverage.json is missing; coverage measurement did not complete")
          totals = json.loads(report.read_text(encoding="utf-8"))["totals"]
          for label, covered, total, missing in (
              ("Statements", "covered_lines", "num_statements", "missing_lines"),
              ("Branches", "covered_branches", "num_branches", "missing_branches"),
          ):
              print(f"{label}: {totals[covered]}/{totals[total]} covered; {totals[missing]} missing")
          if totals["missing_lines"] or totals["missing_branches"] or totals["excluded_lines"]:
              raise SystemExit("Coverage requires zero missing statements/branches and zero excluded lines")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            .artifacts/.coverage
            .artifacts/coverage.xml
            .artifacts/coverage.txt
            .artifacts/coverage.json
          include-hidden-files: true
          retention-days: 7

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP"/actionlint -color .github/workflows/*.yml
