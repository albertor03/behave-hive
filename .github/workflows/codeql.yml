name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          wait-for-processing: true
      - name: Reject high-severity findings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          alerts=$(gh api --method GET "repos/$GITHUB_REPOSITORY/code-scanning/alerts" \
            -f ref="$GITHUB_REF" -f state=open --paginate \
            --jq '.[] | select(.rule.security_severity_level == "high" or
              .rule.security_severity_level == "critical") | .html_url')
          if [[ -n "$alerts" ]]; then
            printf 'High-severity CodeQL findings:\n%s\n' "$alerts"
            exit 1
          fi
